<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pagemates</title>
  <link rel="stylesheet" href="common/theme.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <!-- Salon de l'onglet actif -->
  <section id="main">
    <header class="line">
      <span id="dot" class="dot"></span>
      <strong id="site"></strong>
      <span class="grow"></span>
      <button id="leave" class="small" data-i18n="leaveSite" hidden></button>
      <button id="open-settings" class="icon" data-i18n-title="settings">⚙</button>
    </header>

    <div id="mining" class="notice mining" hidden>
      <p id="mining-title" class="title"></p>
      <progress id="mining-bar" max="100"></progress>
      <p class="help" data-i18n="identityMiningHelp"></p>
    </div>

    <nav id="tabs" class="tabs">
      <button class="tab" data-tab="page"><span data-i18n="tabPage"></span> <span class="n" id="n-page"></span></button>
      <button class="tab" data-tab="site"><span data-i18n="tabSite"></span> <span class="n" id="n-site"></span></button>
      <button class="tab" data-tab="dm"><span data-i18n="privateMessage"></span> <span class="badge" id="unread" hidden></span></button>
    </nav>

    <div id="off" hidden>
      <p id="off-title"></p>
      <p id="off-help" class="muted"></p>
      <button id="off-action" class="primary" hidden></button>
    </div>

    <div id="room">
      <div id="where" hidden>
        <div id="where-path"></div>
        <div id="channel" hidden>
          <button id="channel-btn" class="small"></button>
          <div id="channel-menu" hidden>
            <div id="channel-list"></div>
            <form id="channel-go">
              <input type="number" min="1" max="9999" data-i18n-placeholder="instanceNumber">
              <button class="small" data-i18n="instanceGo"></button>
            </form>
          </div>
        </div>
      </div>
      <div id="tools" hidden></div>
      <div id="people" class="chips"></div>
      <div id="dm-list" class="chips" hidden></div>
      <div id="person" class="card" hidden></div>
      <p id="status" class="muted" hidden></p>
      <ol id="chat" class="chat"></ol>
      <p id="error" class="error" hidden></p>
      <form id="send" class="chat-form">
        <input id="text" type="text" maxlength="500" autocomplete="off">
        <button data-i18n="send"></button>
      </form>
    </div>
  </section>

  <!-- Réglages : cadres dans l'ordre du guide commun (Général, propres à Pagemates, Profil,
       personnes bloquées, Journal, À propos) -->
  <section id="settings" class="settings" hidden>
    <div class="line">
      <button id="close-settings" data-i18n="back"></button>
      <strong data-i18n="settings"></strong>
    </div>

    <fieldset>
      <legend data-i18n="general"></legend>
      <label><span data-i18n="language"></span>
        <select id="set-lang">
          <option value="auto" data-i18n="langAuto"></option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="check"><input id="set-chatSound" type="checkbox"> <span data-i18n="chatSound"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="display"></legend>
      <label><span data-i18n="viewLabel"></span>
        <select id="set-view">
          <option value="both" data-i18n="viewBoth"></option>
          <option value="page" data-i18n="viewPage"></option>
          <option value="site" data-i18n="viewSite"></option>
        </select>
      </label>
      <label class="check"><input id="set-showCursors" type="checkbox"> <span data-i18n="showCursors"></span></label>
      <label class="check"><input id="set-shareCursor" type="checkbox"> <span data-i18n="shareCursor"></span></label>
      <label class="check"><input id="set-shareSelection" type="checkbox"> <span data-i18n="shareSelection"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="connection"></legend>
      <label class="check"><input id="set-autoJoin" type="checkbox"> <span data-i18n="autoJoin"></span></label>
      <p class="help" data-i18n="autoJoinHelp"></p>
      <button id="toggle-connected"></button>
      <p data-i18n="sitesLabel"></p>
      <ul id="sites" class="list"></ul>
    </fieldset>

    <fieldset>
      <legend data-i18n="profile"></legend>
      <label><span data-i18n="nickname"></span>
        <input id="set-name" type="text" maxlength="24" autocomplete="off">
      </label>
      <p><span data-i18n="colorLabel"></span></p>
      <div id="swatches"><input id="set-color" type="color"></div>
      <p><span data-i18n="codeLabel"></span> : <span id="my-code" class="code"></span></p>
      <p class="help" data-i18n="codeHelp"></p>
      <p class="help" data-i18n="ipNotice"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="blockedList"></legend>
      <ul id="blocked" class="list"></ul>
      <p class="help" data-i18n="floodHelp"></p>
    </fieldset>

    <details>
      <summary data-i18n="log"></summary>
      <pre id="log" class="log"></pre>
    </details>

    <fieldset>
      <legend data-i18n="about"></legend>
      <p>Pagemates <span id="version"></span></p>
      <p><a href="https://addons.mozilla.org/firefox/addon/pagemates/" target="_blank" rel="noopener" data-i18n="amoPage"></a></p>
      <p><a href="https://github.com/Tom-Tour/pagemates" target="_blank" rel="noopener" data-i18n="sourceCode"></a></p>
      <p><a href="https://ko-fi.com/tom_t" target="_blank" rel="noopener" data-i18n="support"></a></p>
    </fieldset>
  </section>

  <script src="common/i18n-core.js"></script>
  <script src="i18n.js"></script>
  <script src="common/ui.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
